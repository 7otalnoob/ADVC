name: Build PortMaster artifact

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    env:
      GAME: "gtavc"
      LAUNCHER_SCRIPT: "Grand Theft Auto Vice City.sh"
      BINARY_NAME: "gtavc_linux"
      GAME_TITLE: "Grand Theft Auto: Vice City"
      CONFIG_NAME: "gtavc_nx.cfg"
      APPSTATE_NAME: "appstate.txt"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.GAME }}

      - name: Build and push flat PortMaster OCI artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          target: artifact
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          outputs: |
            type=registry
            type=local,dest=artifact/${{ env.GAME }}
          build-args: |
            GAME=${{ env.GAME }}
            LAUNCHER_SCRIPT=${{ env.LAUNCHER_SCRIPT }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            GAME_TITLE=${{ env.GAME_TITLE }}
            CONFIG_NAME=${{ env.CONFIG_NAME }}
            APPSTATE_NAME=${{ env.APPSTATE_NAME }}

          cache-from: type=gha,scope=${{ env.GAME }}
          cache-to: type=gha,mode=max,scope=${{ env.GAME }}

      - name: Upload flat PortMaster tree
        uses: actions/upload-artifact@v4
        with:
          name: gtavc-portmaster-${{ env.GAME }}
          path: artifact/${{ env.GAME }}
          if-no-files-found: error

      - name: Create and upload release tarball
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p release
          archive="release/gtavc-portmaster-${GAME}-${GITHUB_REF_NAME}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -C "artifact/${GAME}" -czf "$archive" .
          sha256sum "$archive" > "$archive.sha256"
          tar -tzf "$archive" >/dev/null
          gh release upload "${{ github.event.release.tag_name }}" \
            "$archive" "$archive.sha256" --clobber
